name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  brew:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Update Homebrew
        run: brew update

      - name: Test bottle installer and dependency guards
        run: brew ruby tests/build-bottle-test.rb

      - name: Tap local repository
        run: brew tap cmakefmt/cmakefmt ${{ github.workspace }}

      - name: Audit formula
        run: brew audit --strict --online cmakefmt/cmakefmt/cmakefmt

      - name: Install formula from source
        run: brew install --build-from-source cmakefmt/cmakefmt/cmakefmt

      - name: Test formula
        run: brew test cmakefmt/cmakefmt/cmakefmt
